<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Module"/>

<f:section name="Content">

<f:variable name="ll" value="LLL:EXT:ot_mailcatcher/Resources/Private/Language/locallang_mod.xlf:"/>

<div class="callout callout-{status.cssClass}" data-testid="mailcatcher-status" data-status="{status.value}">
    <div class="callout-content d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div>
            <strong data-testid="mailcatcher-status-label"><f:translate key="{ll}{status.statusLabelKey}"/></strong>
            <f:if condition="{enabledSince}">
                <div class="mt-1"><f:translate key="{ll}status.enabledSince" arguments="{0: enabledSince}"/></div>
            </f:if>
            <f:if condition="{status.hintLabelKey}">
                <div class="mt-1"><f:translate key="{ll}{status.hintLabelKey}"/></div>
            </f:if>
            <f:if condition="{isAllowed}">
                <f:else>
                    <div class="text-danger mt-1"><f:translate key="{ll}status.notAllowed"/></div>
                </f:else>
            </f:if>
            <div class="text-body-secondary small mt-1">
                <f:translate key="{ll}status.storage"/>: <code>{storageDirectory}</code>
            </div>
        </div>
        <div class="d-flex gap-2">
            <f:if condition="{isAllowed}">
                <f:form action="toggle" method="post">
                    <button type="submit" data-testid="mailcatcher-toggle" class="btn {f:if(condition: isEnabled, then: 'btn-primary', else: 'btn-warning')}">
                        <f:if condition="{isEnabled}">
                            <f:then><f:translate key="{ll}action.disable"/></f:then>
                            <f:else><f:translate key="{ll}action.enable"/></f:else>
                        </f:if>
                    </button>
                </f:form>
            </f:if>
            <f:if condition="{mails}">
                <f:link.action action="confirmDeleteAll" class="btn btn-default">
                    <f:translate key="{ll}action.deleteAll"/>
                </f:link.action>
            </f:if>
        </div>
    </div>
</div>

<f:for each="{environmentFindings}" as="finding">
    <div class="alert alert-{finding.severity.cssClass}">
        <strong><f:translate key="{ll}{finding.messageLabelKey}"/></strong>
        <div class="mt-1"><f:translate key="{ll}{finding.hintLabelKey}"/></div>
    </div>
</f:for>

<f:if condition="{mails}">
    <f:then>
        <div class="table-fit">
            <table class="table table-striped table-hover" data-testid="mailcatcher-list">
                <thead>
                <tr>
                    <th><f:translate key="{ll}list.findings"/></th>
                    <th><f:translate key="{ll}list.subject"/></th>
                    <th><f:translate key="{ll}list.from"/></th>
                    <th><f:translate key="{ll}list.to"/></th>
                    <th><f:translate key="{ll}list.date"/></th>
                    <th><f:translate key="{ll}list.size"/></th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <f:for each="{mails}" as="row">
                    <tr data-testid="mailcatcher-row" data-identifier="{row.mail.identifier}">
                        <td>
                            <f:if condition="{row.mail.checkResults}">
                                <f:then>
                                    <span class="badge bg-{row.highestSeverity.cssClass}">{row.mail.checkResults -> f:count()}</span>
                                </f:then>
                                <f:else>
                                    <span class="badge bg-success">0</span>
                                </f:else>
                            </f:if>
                        </td>
                        <td>
                            <f:link.action action="show" arguments="{identifier: row.mail.identifier}">
                                <f:if condition="{row.mail.subject}">
                                    <f:then>{row.mail.subject}</f:then>
                                    <f:else><em>&#8212;</em></f:else>
                                </f:if>
                            </f:link.action>
                        </td>
                        <td>{row.mail.from}</td>
                        <td>{row.mail.toAsString}</td>
                        <td><f:if condition="{row.mail.date}"><f:format.date format="d.m.Y H:i:s">{row.mail.date}</f:format.date></f:if></td>
                        <td><f:format.bytes decimals="1">{row.mail.size}</f:format.bytes></td>
                        <td class="text-end">
                            <div class="d-flex gap-1 justify-content-end">
                                <f:if condition="{isEnabled}">
                                    <f:else>
                                        <f:form action="resend" method="post" arguments="{identifier: row.mail.identifier}">
                                            <button type="submit" data-testid="mailcatcher-resend" class="btn btn-default btn-sm"><f:translate key="{ll}action.resend"/></button>
                                        </f:form>
                                    </f:else>
                                </f:if>
                                <f:form action="delete" method="post" arguments="{identifier: row.mail.identifier}">
                                    <button type="submit" data-testid="mailcatcher-delete" class="btn btn-default btn-sm"><f:translate key="{ll}action.delete"/></button>
                                </f:form>
                            </div>
                        </td>
                    </tr>
                </f:for>
                </tbody>
            </table>
        </div>
    </f:then>
    <f:else>
        <p class="text-body-secondary" data-testid="mailcatcher-empty"><f:translate key="{ll}list.empty"/></p>
    </f:else>
</f:if>
</f:section>

</html>
